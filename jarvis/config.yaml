name: "Jarvis AI Agent"
description: "Agente IA especializado en tu Home Assistant. Controla dispositivos, escribe automatizaciones, gestiona archivos, aprende de tu instalación."
version: "2.1.0"
slug: "claude_ha_chat"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: application
boot: auto
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Interfaz web del agente"
ingress: true
ingress_port: 3000
panel_icon: mdi:robot-happy
panel_title: Jarvis
homeassistant_api: true
map:
  - config:rw
  - addons:ro
  - share:rw
  - media:ro
options:
  anthropic_api_key: ""
  model: "claude-sonnet-4-6"
  language: "es"
schema:
  anthropic_api_key: str
  model: str
  language: str
