name: "Jarvis AI Agent"
description: "Jarvis — Tu agente IA privado para Home Assistant. Controla tu casa, crea automatizaciones, gestiona dashboards, instala herramientas, accede a Proxmox y aprende con cada uso."
version: "2.7.0"
slug: "jarvis_ai_agent"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: application
boot: auto
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Interfaz web del agente"
ingress: true
ingress_port: 3000
panel_icon: mdi:robot-happy
panel_title: Jarvis
homeassistant_api: true
map:
  - config:rw
  - addons:ro
  - share:rw
  - media:ro
options:
  anthropic_api_key: ""
  model: "claude-sonnet-4-6"
  language: "es"
  proxmox_url: ""
  proxmox_token: ""
  proxmox_node: "pve"
schema:
  anthropic_api_key: str
  model: str
  language: str
  proxmox_url: str?
  proxmox_token: str?
  proxmox_node: str?
