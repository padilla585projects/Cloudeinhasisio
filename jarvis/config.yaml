name: "Jarvis AI Agent"
description: "Jarvis — Asistente IA para Home Assistant. Control por voz y texto."
version: "3.33.12"
slug: "jarvis_ai_agent"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: application
boot: auto
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Interfaz web del agente"
ingress: true
ingress_port: 3000
panel_icon: mdi:robot
panel_title: Jarvis
homeassistant_api: true
hassio_api: true
hassio_role: manager
host_network: true
map:
  - config:rw
  - addons:ro
  - share:rw
  - media:ro
options:
  openai_api_key: ""
  serper_api_key: ""
  language: "es"
  proxmox_url: ""
  proxmox_token: ""
  proxmox_node: "pve"
  github_token: ""
  anthropic_api_key: ""
  deepseek_api_key: ""
  agent_net_enabled: true
  agent_net_url: "https://getaway-gateway.alejandra-app.workers.dev"
  agent_net_invite: "getaway2026"
  telegram_bot_token: ""
  telegram_allowed_ids: ""
schema:
  openai_api_key: str
  serper_api_key: str?
  language: str
