name: Claude MCP Server
version: "1.0.3"
slug: claude_mcp
description: Servidor MCP completo para Claude con acceso total a Home Assistant
url: https://github.com/padilla585projects/Cloudeinhasisio
arch:
  - aarch64
  - amd64
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:latest
  amd64: ghcr.io/home-assistant/amd64-base:latest
startup: application
boot: auto
host_network: false
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: MCP Server
options:
  anthropic_api_key: ""
  ha_token: ""
  port: 8765
schema:
  anthropic_api_key: str
  ha_token: str
  port: int
map:
  - config:rw
panel_icon: mdi:robot
panel_title: Claude MCP
init: false
